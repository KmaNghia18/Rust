[package]
name = "discord-desktop"
version = "0.1.0"
description = "Discord Clone — Desktop App (Tauri)"
authors = ["Discord Clone Team"]
edition = "2021"

[lib]
name = "discord_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "discord-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri         = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-shell        = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs           = "2"
tauri-plugin-dialog       = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance  = "2"
tauri-plugin-updater      = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store        = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
tokio-tungstenite = { workspace = true }
futures     = "0.3"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyring     = "2"        # OS keychain for secure token storage
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
url         = "2"
