[package]
name = "shared-ratelimit"
version = "0.1.0"
edition = "2021"

[dependencies]
axum        = "0.7"
redis       = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
thiserror   = "1"
tracing     = "0.1"
chrono      = "0.4"
