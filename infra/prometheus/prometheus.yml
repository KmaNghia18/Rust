global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'discord-clone'
    env: 'production'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ── Self-monitoring ─────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Rust Microservices ──────────────────────────────────────────────────────
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth:8001']
    metrics_path: '/metrics'

  - job_name: 'gateway-service'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/metrics'

  - job_name: 'guilds-service'
    static_configs:
      - targets: ['guilds:8002']
    metrics_path: '/metrics'

  - job_name: 'messages-service'
    static_configs:
      - targets: ['messages:8003']
    metrics_path: '/metrics'

  - job_name: 'voice-service'
    static_configs:
      - targets: ['voice:8004']
    metrics_path: '/metrics'

  - job_name: 'media-service'
    static_configs:
      - targets: ['media:8005']
    metrics_path: '/metrics'

  - job_name: 'search-service'
    static_configs:
      - targets: ['search:8006']
    metrics_path: '/metrics'

  - job_name: 'notifications-service'
    static_configs:
      - targets: ['notifications:8007']
    metrics_path: '/metrics'

  # ── Infrastructure ──────────────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: '/_prometheus/metrics'

  - job_name: 'scylladb'
    static_configs:
      - targets: ['scylladb:9180']

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'

  # ── Node metrics ────────────────────────────────────────────────────────────
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
